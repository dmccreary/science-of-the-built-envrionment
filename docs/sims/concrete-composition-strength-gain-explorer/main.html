<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Concrete Composition and Strength Gain Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        main { width: 100%; border: 1px solid silver; background: white; }
        h1 { margin: 0; padding: 5px 10px; font-size: 20px; text-align: center; background: aliceblue; border-bottom: 1px solid silver; }
        #charts { display: flex; flex-wrap: wrap; background: aliceblue; border-bottom: 1px solid silver; }
        #pieWrap { position: relative; flex: 1 1 280px; height: 390px; padding: 4px 6px; }
        #lineWrap { position: relative; flex: 2 1 380px; height: 390px; padding: 4px 6px; }
        #controls { padding: 6px 10px; font-size: 15px; border-bottom: 1px solid silver; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; margin: 3px 0; }
        .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; flex: 1 1 340px; }
        .ctl.slide { max-width: calc(50% - 10px); }
        @media (max-width: 760px) { .ctl.slide { max-width: none; } }
        .ctl label.t { min-width: 215px; white-space: nowrap; }
        .ctl input[type=range] { flex: 1 1 90px; min-width: 80px; }
        .row label.opt { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        #readout { padding: 6px 10px; }
        .stats { display: flex; flex-wrap: wrap; gap: 4px 18px; }
        .stat span { display: block; font-size: 13px; color: dimgray; }
        .stat b { font-size: 18px; color: navy; }
        .state { margin: 4px 0; padding: 3px 8px; border-left: 5px solid gray; font-weight: bold; }
        .state.ok { border-color: seagreen; background: honeydew; }
        .state.wait { border-color: darkorange; background: floralwhite; }
        .note { line-height: 1.35; margin-top: 3px; }
        .foot { margin-top: 3px; color: dimgray; font-size: 13px; line-height: 1.3; }
        @media (max-width: 520px) {
            #pieWrap { height: 195px; flex-basis: 100%; }
            #lineWrap { height: 245px; flex-basis: 100%; }
            .foot { display: none; }
            #controls { font-size: 14px; padding: 4px 8px; }
            .ctl label.t { min-width: 0; }
            .row { gap: 2px 10px; margin: 1px 0; }
            #readout { padding: 4px 8px; }
        }
    </style>
    <script src="concrete-composition-strength-gain-explorer.js"></script>
</head>
<body>
    <main>
        <h1>Concrete Composition and Strength Gain Explorer</h1>
        <div id="charts">
            <div id="pieWrap"><canvas id="pieChart" role="img" aria-label="Doughnut chart of the volumes of aggregates, cement, water, and air in one cubic yard of concrete"></canvas></div>
            <div id="lineWrap"><canvas id="lineChart" role="img" aria-label="Strength gain curves of concrete from 0 to 28 days for three curing conditions"></canvas></div>
        </div>
        <div id="controls">
            <div class="row">
                <div class="ctl slide"><label class="t" for="fcSlider" id="fcText">Specified strength f′c: 4,000 psi</label>
                    <input type="range" id="fcSlider" min="3000" max="6000" step="100" value="4000" aria-label="Specified strength in psi"></div>
                <div class="ctl slide"><label class="t" for="airSlider" id="airText">Air content: 6.0 %</label>
                    <input type="range" id="airSlider" min="0" max="8" step="0.5" value="6" aria-label="Air content in percent"></div>
            </div>
            <div class="row">
                <div class="ctl slide"><label class="t" for="ageSlider" id="ageText">Age: 7 days</label>
                    <input type="range" id="ageSlider" min="0" max="28" step="1" value="7" aria-label="Age in days"></div>
            </div>
            <div class="row">
                <div class="ctl" role="radiogroup" aria-label="Curing"><b>Curing:</b>
                    <label class="opt"><input type="radio" name="cure" value="moist" checked> Moist-cured</label>
                    <label class="opt"><input type="radio" name="cure" value="three"> Cured 3 days only</label>
                    <label class="opt"><input type="radio" name="cure" value="none"> Not cured</label></div>
            </div>
        </div>
        <div id="readout" aria-live="polite"></div>
    </main>
</body>
</html>
