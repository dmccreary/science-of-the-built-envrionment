<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Failure Chain Explorer</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        #app { width: 100%; height: 100%; border: 1px solid silver; display: flex; flex-direction: column; background: white; }
        #titleBar { flex: 0 0 auto; text-align: center; font-size: 20px; font-weight: bold; padding: 4px 6px 2px; background: aliceblue; }
        #controls { flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 5px 8px; font-size: 15px; background: aliceblue; }
        #controls select { font-size: 15px; padding: 2px 4px; }
        #controls button { font-size: 15px; padding: 3px 10px; cursor: pointer; }
        #controls button.active { background: darkorange; border: 1px solid black; font-weight: bold; }
        #legend { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 2px 14px; padding: 3px 10px; font-size: 13px; background: aliceblue; border-bottom: 1px solid silver; }
        .sw { display: inline-block; width: 14px; height: 14px; border: 2px solid; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
        #network { flex: 1 1 auto; min-height: 200px; background: aliceblue; border-bottom: 1px solid silver; overflow: hidden; }
        #outcome { flex: 0 0 auto; padding: 4px 10px; font-size: 14px; line-height: 1.35; border-bottom: 1px solid silver; min-height: 40px; }
        #outcome b { color: navy; }
        #edgeNote { flex: 0 0 auto; padding: 3px 10px; font-size: 13px; color: #333; background: lightyellow; border-bottom: 1px solid silver; min-height: 24px; line-height: 1.3; }
        #info { flex: 0 0 auto; padding: 4px 10px; font-size: 14px; line-height: 1.35; min-height: 96px; overflow: auto; }
        #info h3 { margin: 0 0 2px; font-size: 15px; color: navy; }
        #info p { margin: 2px 0; }
        div.vis-tooltip { white-space: normal !important; max-width: 280px; font-size: 14px !important; padding: 6px 8px !important; }
        @media (max-width: 560px) {
            #titleBar { font-size: 17px; }
            #controls { font-size: 14px; }
            #controls select, #controls button { font-size: 14px; }
            #legend { font-size: 12px; gap: 1px 10px; }
            #outcome, #info { font-size: 13px; }
            #edgeNote { font-size: 12px; }
        }
    </style>
    <script src="failure-chain-explorer.js" defer></script>
</head>
<body>
    <main id="app">
        <div id="titleBar">Failure Chain Explorer</div>
        <div id="controls">
            <label for="scenario">Scenario</label>
            <select id="scenario">
                <option value="flash">Riverbend flashing</option>
                <option value="drain">Roof drain</option>
                <option value="settle">Settlement</option>
                <option value="all">All four chains</option>
            </select>
            <button type="button" id="breakBtn" aria-pressed="false">Break the chain</button>
            <button type="button" id="resetBtn">Reset</button>
        </div>
        <div id="legend">
            <span><span class="sw" style="background:lightskyblue;border-color:steelblue"></span>Root cause</span>
            <span><span class="sw" style="background:orange;border-color:darkorange"></span>Mechanism</span>
            <span><span class="sw" style="background:tomato;border-color:firebrick"></span>Damage process</span>
            <span><span class="sw" style="background:lightgray;border-color:dimgray"></span>Visible symptom</span>
            <span><span class="sw" style="background:white;border-color:dimgray;border-style:dashed"></span>Removed</span>
        </div>
        <div id="network" role="img" aria-label="Directed graph from left to right. Root causes (omitted flashing, clogged drain, wet lumber, settlement) lead to mechanisms (water enters wall, water ponds on roof, moisture content rises, foundation moves), then to damage processes (decay, mold, freeze-thaw, cracking), then to visible symptoms (stain, peeling paint, sagging, leak)."></div>
        <div id="outcome" aria-live="polite"></div>
        <div id="edgeNote" aria-live="polite"></div>
        <div id="info" aria-live="polite"></div>
    </main>
</body>
</html>
