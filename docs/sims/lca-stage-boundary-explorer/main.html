<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Life-Cycle Stage and Boundary Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        main { height: 100%; display: flex; flex-direction: column; border: 1px solid silver; background: white; }
        h2 { margin: 0; padding: 4px 8px 2px 8px; font-size: 20px; text-align: center; background: aliceblue; }
        #chartWrap { flex: 1 1 auto; min-height: 0; position: relative; background: aliceblue; padding: 2px 6px; border-bottom: 1px solid silver; }
        #readout { padding: 5px 10px; font-size: 15px; line-height: 1.35; border-bottom: 1px solid silver; }
        #readout b { color: navy; }
        #readout .sub { color: #333; font-size: 14px; }
        #info { margin: 5px 10px; padding: 4px 8px; border-left: 5px solid steelblue; background: aliceblue; font-size: 14px; line-height: 1.35; min-height: 52px; }
        #controls { padding: 2px 10px 6px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 3px 20px; }
        .ctl { display: flex; align-items: center; gap: 8px; }
        .ctl span { flex: 0 0 230px; font-size: 14px; }
        .ctl input[type=range] { flex: 1 1 auto; min-width: 80px; margin: 0; }
        .ctl select { flex: 1 1 auto; min-width: 0; font-size: 14px; padding: 2px; }
        button { font-size: 14px; padding: 3px 10px; cursor: pointer; margin-top: 3px; }
        @media (max-width: 560px) {
            #readout { font-size: 14px; }
            #readout .sub, #info { font-size: 13px; }
            .ctl span { flex: 0 0 150px; font-size: 13px; }
        }
    </style>
    <script src="lca-stage-boundary-explorer.js" defer></script>
</head>
<body>
    <main>
        <h2>Life-Cycle Stage and Boundary Explorer</h2>
        <div id="chartWrap"><canvas id="lcaChart" role="img" aria-label="Stacked horizontal bar chart of life-cycle carbon dioxide equivalent emissions in tonnes for the Riverbend building: modules A1 to A3 product stage, A4 to A5 construction, B use, and C end of life. One bar shows the current design and a second bar shows the efficient, electrified case. Each segment is labeled with its percentage of the total."></canvas></div>
        <div id="readout" aria-live="polite"></div>
        <div id="info" aria-live="polite"></div>
        <div id="controls">
            <div class="grid">
                <label class="ctl"><span style="flex-basis:120px">System boundary</span>
                    <select id="boundary" aria-label="System boundary">
                        <option value="gate">Cradle to gate (A1-A3)</option>
                        <option value="constr">Through construction (A1-A5)</option>
                        <option value="grave" selected>Cradle to grave (A1-C)</option>
                    </select></label>
                <label class="ctl"><span id="lblOp"></span><input type="range" id="opShare" min="10" max="100" step="1" value="100" aria-label="Operating energy as a share of baseline, percent"></label>
                <label class="ctl"><span id="lblYr"></span><input type="range" id="years" min="20" max="100" step="1" value="60" aria-label="Study period in years"></label>
                <div><button type="button" id="effBtn">Apply efficient and electrified case</button></div>
            </div>
        </div>
    </main>
</body>
</html>
