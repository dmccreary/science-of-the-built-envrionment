<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Ground Temperature versus Depth Explorer</title>
    <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: black; background: white; }
        main { width: 100%; border: 1px solid silver; background: white; }
        h1 { margin: 0; padding: 5px 10px; font-size: 20px; text-align: center; background: aliceblue; border-bottom: 1px solid silver; }
        #panel { padding: 6px 10px; border-bottom: 1px solid silver; min-height: 230px; }
        .status { font-weight: bold; margin: 0 0 3px; white-space: pre-wrap; }
        .setting { color: dimgray; font-size: 15px; margin: 0 0 3px; }
        .question { margin: 0 0 5px; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 4px 0; }
        .row input[type=number], .row select { font-size: 16px; }
        .row input[type=number] { width: 80px; }
        button { font-size: 16px; }
        .msg { margin: 6px 0 0; padding: 4px 8px; border-left: 5px solid silver; background: white; min-height: 58px; line-height: 1.3; }
        .msg.good { border-color: seagreen; background: honeydew; }
        .msg.bad { border-color: firebrick; background: mistyrose; }
        .ctl { display: flex; align-items: center; gap: 4px 10px; margin: 4px 0; }
        .ctl label.t { width: 150px; flex: 0 0 auto; white-space: nowrap; }
        .ctl select { font-size: 16px; max-width: 100%; }
        .ctl input[type=range] { flex: 1 1 120px; min-width: 80px; }
        #plotBox { position: relative; height: 330px; background: aliceblue; border-bottom: 1px solid silver; }
        #plot { width: 100%; height: 100%; }
        #plotHidden { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: dimgray; background: aliceblue; padding: 10px; }
        #readout { padding: 5px 10px; line-height: 1.3; min-height: 92px; }
        #readout b { color: navy; }
        .foot { color: dimgray; font-size: 14px; margin-top: 3px; }
        .hide { display: none !important; }
        @media (max-width: 520px) { .ctl label.t { width: 90px; } }
    </style>
    <script src="ground-temperature-depth-explorer.js"></script>
</head>
<body>
    <main>
        <h1>Ground Temperature versus Depth Explorer</h1>
        <div id="panel">
            <div id="challengePane">
                <p class="status" id="status"></p>
                <p class="setting" id="setting"></p>
                <p class="question" id="question"></p>
                <div class="row" id="numRow">
                    <label for="numInput"><b id="numLabel">Answer:</b></label>
                    <input type="number" id="numInput" step="0.1" aria-label="Your answer"> <span id="numUnit"></span>
                </div>
                <div class="row hide" id="dateRow">
                    <label for="monthSel"><b>Date:</b></label>
                    <select id="monthSel" aria-label="Month"></select>
                    <input type="number" id="dayInput" min="1" max="31" step="1" aria-label="Day of the month">
                </div>
                <div class="row">
                    <button id="checkBtn" type="button">Check</button>
                    <button id="nextBtn" type="button">Next challenge</button>
                </div>
                <div class="msg" id="msg" aria-live="polite"></div>
            </div>
            <div id="explorePane" class="hide">
                <div class="ctl"><label class="t" for="siteSel"><b>Site</b></label>
                    <select id="siteSel" aria-label="Site"></select></div>
                <div class="ctl"><label class="t" for="soilSel"><b>Soil</b></label>
                    <select id="soilSel" aria-label="Soil"></select></div>
                <div class="ctl"><label class="t" for="depthSlider" id="depthText">Marker depth: 10 ft</label>
                    <input type="range" id="depthSlider" min="0" max="30" step="1" value="10" aria-label="Depth of the marker in feet">
                    <button id="restartBtn" type="button">Restart challenges</button></div>
            </div>
        </div>
        <div id="plotBox">
            <div id="plot" role="img" aria-label="Temperature against depth for four dates of the year, showing the seasonal swing shrinking and shifting later with depth"></div>
            <div id="plotHidden">The curves stay hidden until you answer. Predict first, then check.</div>
        </div>
        <div id="readout" aria-live="polite"></div>
    </main>
</body>
</html>
