<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Insulation Diminishing Returns Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        main { width: 100%; border: 1px solid silver; background: white; }
        #chartWrap { position: relative; height: 330px; padding: 4px 6px; background: aliceblue; border-bottom: 1px solid silver; }
        #chart { touch-action: pan-y; }
        #controls { padding: 6px 10px; font-size: 15px; border-bottom: 1px solid silver; display: grid; grid-template-columns: 1fr 1fr; gap: 3px 22px; }
        .ctl { display: flex; align-items: center; gap: 2px 10px; min-width: 0; }
        .ctl label { flex: 0 0 auto; width: 200px; white-space: nowrap; }
        .ctl input[type=range] { flex: 1 1 90px; min-width: 70px; }
        .ctl button { font-size: 14px; padding: 2px 8px; }
        @media (max-width: 760px) { #controls { grid-template-columns: 1fr; gap: 1px; } }
        #readout { padding: 6px 10px; }
        table { border-collapse: collapse; width: 100%; font-size: 14px; }
        th, td { border: 1px solid silver; padding: 2px 6px; text-align: right; }
        th:first-child, td:first-child { text-align: left; }
        thead th { background: aliceblue; }
        td.key { font-weight: bold; color: navy; }
        .state { margin: 5px 0; padding: 3px 8px; border-left: 5px solid gray; font-weight: bold; }
        .state.ok { border-color: seagreen; background: honeydew; }
        .state.bad { border-color: darkorange; background: floralwhite; }
        .note { line-height: 1.35; margin-top: 3px; }
        .foot { margin-top: 3px; color: dimgray; font-size: 13px; line-height: 1.3; }
        @media (max-width: 520px) {
            #chartWrap { height: 285px; }
            #controls { font-size: 14px; padding: 4px 8px; }
            .ctl label { width: 205px; }
            #readout { padding: 4px 8px; }
            table, th, td { font-size: 13px; }
            .foot { display: none; }
        }
    </style>
    <script src="insulation-diminishing-returns-explorer.js"></script>
</head>
<body>
    <main>
        <div id="chartWrap"><canvas id="chart" role="img" aria-label="Line chart of annual heat loss in MMBtu against insulation R-value from R-5 to R-60, with two draggable markers for the current and proposed R-values"></canvas></div>
        <div id="controls">
            <div class="ctl"><label for="areaS" id="areaT">Roof area: 9,000 ft²</label><input type="range" id="areaS" min="1000" max="20000" step="500" value="9000" aria-label="Roof area in square feet"></div>
            <div class="ctl"><label for="hddS" id="hddT">Heating degree days: 7,500</label><input type="range" id="hddS" min="4000" max="9000" step="100" value="7500" aria-label="Heating degree days"></div>
            <div class="ctl"><label for="gasS" id="gasT">Gas price: $10.00 per MMBtu</label><input type="range" id="gasS" min="5" max="20" step="0.5" value="10" aria-label="Gas price in dollars per MMBtu"></div>
            <div class="ctl"><label for="effS" id="effT">Furnace efficiency: 90 %</label><input type="range" id="effS" min="60" max="98" step="1" value="90" aria-label="Furnace efficiency in percent"></div>
            <div class="ctl"><label for="costS" id="costT">Cost per added R-20: $1.50/ft²</label><input type="range" id="costS" min="0.5" max="4" step="0.1" value="1.5" aria-label="Insulation cost in dollars per square foot per added R-20"></div>
            <div class="ctl"><label for="curS" id="curT">Current R: R-30</label><input type="range" id="curS" min="5" max="59" step="1" value="30" aria-label="Current R-value"></div>
            <div class="ctl"><label for="propS" id="propT">Proposed R: R-50</label><input type="range" id="propS" min="6" max="60" step="1" value="50" aria-label="Proposed R-value"></div>
            <div class="ctl"><button type="button" id="resetB">Reset to Riverbend defaults</button></div>
        </div>
        <div id="readout" aria-live="polite"></div>
    </main>
</body>
</html>
