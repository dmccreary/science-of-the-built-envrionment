# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'The Science of the Built Environment'
site_description: 'An interactive intelligent textbook on the science of the built environment: how buildings, materials, energy, air, light, and sound shape human health, comfort, and sustainability.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/science-of-the-built-envrionment/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/science-of-the-built-envrionment'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Introduction to the Built Environment and Construction Terminology: chapters/01-intro-terminology/index.md
      - 2. The Design and Construction Process: chapters/02-design-construction-process/index.md
      - 3. Forces, Heat, and the Physics of Buildings: chapters/03-forces-heat-physics/index.md
      - 4. Moisture, Air Movement, and Thermal Comfort: chapters/04-moisture-air-comfort/index.md
      - 5. Properties of Building Materials: chapters/05-material-properties/index.md
      - 6. Structural Loads and Load Paths: chapters/06-structural-loads/index.md
      - 7. Wood and Steel Framing: chapters/07-wood-steel-framing/index.md
      - 8. Concrete and Masonry: chapters/08-concrete-masonry/index.md
      - 9. Site Work, Soils, and Groundwater: chapters/09-site-soils/index.md
      - 10. Foundation Systems: chapters/10-foundation-systems/index.md
      - 11. Enclosure Control Layers and Insulation: chapters/11-enclosure-insulation/index.md
      - 12. Cladding, Windows, Doors, and Air Sealing: chapters/12-cladding-windows-air-sealing/index.md
      - 13. Roof Assemblies: chapters/13-roof-assemblies/index.md
      - 14. HVAC, Plumbing, and Fire Protection Systems: chapters/14-hvac-plumbing-fire/index.md
      - 15. Electrical Fundamentals and Building Service: chapters/15-electrical-fundamentals/index.md
      - 16. Electrical Distribution, Lighting, and Design Team Coordination: chapters/16-electrical-distribution-design/index.md
      - 17. Building Codes, Permits, and Enforcement: chapters/17-building-codes-permits/index.md
      - 18. Fire Protection and Life Safety Requirements: chapters/18-fire-life-safety/index.md
      - 19. Energy Efficiency and High-Performance Buildings: chapters/19-energy-efficiency/index.md
      - 20. Sustainable Building Materials: chapters/20-sustainable-materials/index.md
      - 21. Durability, Maintenance, and Building Failure: chapters/21-durability-failure/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      # Generated by learning-graph-generator skill:
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - Learning Graph Viewer: sims/graph-viewer/index.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'green'
    accent: 'amber'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md
  # Remove the next line (and add mascot-test.md to the nav) once the mascot PNGs exist:
  learning-graph/mascot-test.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'The Science of the Built Environment'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
