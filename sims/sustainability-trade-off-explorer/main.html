<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Sustainability Trade-Off Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        main { height: 100%; display: flex; flex-direction: column; border: 1px solid silver; background: white; }
        h2 { margin: 0; padding: 4px 8px 2px 8px; font-size: 20px; text-align: center; background: aliceblue; }
        #charts { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: row; background: aliceblue; border-bottom: 1px solid silver; }
        .cwrap { position: relative; min-width: 0; min-height: 0; padding: 2px 6px; }
        #radarWrap { flex: 1 1 0; }
        #barWrap { flex: 1 1 0; }
        #verdict { padding: 5px 10px 2px; font-size: 16px; font-weight: bold; color: navy; line-height: 1.3; }
        #readout { padding: 0 10px 4px; font-size: 14px; line-height: 1.35; border-bottom: 1px solid silver; color: #222; }
        #readout div { margin: 1px 0; }
        #controls { padding: 5px 10px 0; }
        .wgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 2px 18px; }
        .ctl { display: flex; align-items: center; gap: 8px; }
        .ctl span { flex: 0 0 128px; font-size: 14px; white-space: nowrap; }
        .ctl input[type=range] { flex: 1 1 auto; min-width: 70px; margin: 0; }
        .btns { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 5px 0 4px; }
        .btns button { font-size: 14px; padding: 2px 8px; cursor: pointer; }
        .btns label { display: flex; align-items: center; gap: 4px; font-size: 14px; margin-left: 6px; }
        table { border-collapse: collapse; width: 100%; font-size: 14px; margin-bottom: 4px; }
        th, td { border: 1px solid silver; padding: 1px 4px; text-align: center; }
        th { background: aliceblue; font-weight: bold; }
        td.nm { text-align: left; }
        td.tot { font-weight: bold; }
        tr.lead td { background: lightyellow; }
        select.sc { font-size: 14px; padding: 0 2px; }
        select.sc:disabled { appearance: none; -webkit-appearance: none; border-color: transparent; background: transparent; color: black; opacity: 1; padding: 0 10px; }
        @media (max-width: 520px) {
            #charts { flex-direction: column; }
            #radarWrap { flex: 7 1 0; }
            #barWrap { flex: 4 1 0; }
            #verdict { font-size: 15px; }
            #readout, .btns button, .btns label, table { font-size: 13px; }
            .ctl span { flex: 0 0 118px; font-size: 13px; }
        }
    </style>
    <script src="sustainability-trade-off-explorer.js" defer></script>
</head>
<body>
    <main>
        <h2>Sustainability Trade-Off Explorer</h2>
        <div id="charts">
            <div class="cwrap" id="radarWrap"><canvas id="radarChart" role="img" aria-label="Radar chart with axes Environment, Society, and Economy from 0 to 5 showing the scores of three Riverbend heating options: A gas rooftop unit, B air-source heat pump, and C ground-source heat pump"></canvas></div>
            <div class="cwrap" id="barWrap"><canvas id="barChart" role="img" aria-label="Bar chart of the weighted total score of each heating option on a scale of 0 to 5, with the leading option highlighted"></canvas></div>
        </div>
        <div id="verdict" aria-live="polite"></div>
        <div id="readout" aria-live="polite"></div>
        <div id="controls">
            <div class="wgrid">
                <label class="ctl"><span id="lblW0"></span><input type="range" id="w0" min="0" max="100" step="1" value="33" aria-label="Environment weight in percent"></label>
                <label class="ctl"><span id="lblW1"></span><input type="range" id="w1" min="0" max="100" step="1" value="33" aria-label="Society weight in percent"></label>
                <label class="ctl"><span id="lblW2"></span><input type="range" id="w2" min="0" max="100" step="1" value="34" aria-label="Economy weight in percent"></label>
            </div>
            <div class="btns">
                <button type="button" id="pEqual">Equal</button>
                <button type="button" id="pCost">Cost first</button>
                <button type="button" id="pClimate">Climate first</button>
                <label><input type="checkbox" id="editBox"> Edit scores</label>
                <button type="button" id="resetBtn">Reset</button>
            </div>
            <table id="scoreTable" aria-label="Scores from 1 to 5 and weighted totals"></table>
        </div>
    </main>
</body>
</html>
