<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Heating System Energy Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        html, body { height: 100%; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        main { height: 100%; display: flex; flex-direction: column; border: 1px solid silver; background: white; }
        h2 { margin: 0; padding: 4px 8px 2px 8px; font-size: 20px; text-align: center; background: aliceblue; }
        #charts { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: row; background: aliceblue; border-bottom: 1px solid silver; }
        .cwrap { position: relative; min-width: 0; min-height: 0; padding: 2px 6px; }
        #barWrap { flex: 11 1 0; }
        #lineWrap { flex: 9 1 0; }
        #readout { padding: 5px 10px; border-bottom: 1px solid silver; font-size: 15px; line-height: 1.35; }
        #readout .big { font-size: 17px; font-weight: bold; color: navy; }
        #readout .note { color: dimgray; font-size: 14px; }
        #controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 4px 20px; padding: 6px 10px 2px 10px; }
        .ctl { display: flex; align-items: center; gap: 8px; }
        .ctl span { flex: 0 0 172px; font-size: 15px; }
        .ctl input[type=range] { flex: 1 1 auto; min-width: 90px; margin: 0; }
        .ctl select { flex: 1 1 auto; min-width: 0; font-size: 15px; padding: 2px; }
        #status { margin: 4px 10px 6px 10px; padding: 4px 8px; border-left: 5px solid steelblue; background: aliceblue; font-size: 15px; line-height: 1.35; min-height: 38px; }
        #status.warn { border-left-color: darkorange; background: floralwhite; }
        @media (max-width: 640px) {
            #charts { flex-direction: column; }
            #barWrap, #lineWrap { flex: 1 1 0; }
            #readout { font-size: 14px; }
            #readout .big { font-size: 16px; }
            #status { font-size: 14px; }
            .hide-narrow { display: none; }
            .ctl span { flex: 0 0 182px; font-size: 14px; }
        }
    </style>
    <script src="heating-system-energy-comparison.js"></script>
</head>
<body>
    <main>
        <h2>Heating System Energy Comparison</h2>
        <div id="charts">
            <div class="cwrap" id="barWrap"><canvas id="barChart" role="img" aria-label="Horizontal bars of the energy input in kilowatts needed by an 80 percent furnace, a 95 percent furnace, electric resistance, and a heat pump to deliver the same heat"></canvas></div>
            <div class="cwrap" id="lineWrap"><canvas id="copChart" role="img" aria-label="Line chart of illustrative heat pump coefficient of performance against outdoor temperature from minus 20 to 60 degrees Fahrenheit for standard and cold-climate air-source heat pumps"></canvas></div>
        </div>
        <div id="readout" aria-live="polite"></div>
        <div id="controls">
            <label class="ctl"><span id="lblQ"></span><input type="range" id="heatOut" min="20000" max="200000" step="5000" value="80000" aria-label="Required heat output in BTU per hour"></label>
            <label class="ctl"><span id="lblT"></span><input type="range" id="outT" min="-20" max="60" step="1" value="17" aria-label="Outdoor temperature in degrees Fahrenheit"></label>
            <label class="ctl"><span>Heat pump type:</span>
                <select id="hpType" aria-label="Heat pump type">
                    <option value="cold">Cold-climate air-source</option>
                    <option value="std">Standard air-source</option>
                </select></label>
        </div>
        <div id="status" aria-live="polite"></div>
    </main>
</body>
</html>
