<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Wood Moisture and Shrinkage Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        main { width: 100%; border: 1px solid silver; background: white; }
        #chartWrap { position: relative; height: 330px; background: aliceblue; border-bottom: 1px solid silver; padding: 4px 6px 2px 6px; }
        #controls { padding: 6px 10px; font-size: 15px; border-bottom: 1px solid silver; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin: 3px 0; }
        .row label.t { min-width: 170px; white-space: nowrap; }
        .row input[type=range] { flex: 1 1 160px; min-width: 110px; max-width: 420px; }
        select, button, input[type=number] { font-size: 15px; padding: 2px 8px; }
        input[type=number] { width: 90px; }
        #lower { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 6px 10px; }
        #readout { flex: 1 1 300px; }
        #sample { flex: 1 1 300px; }
        h3 { margin: 0 0 4px 0; font-size: 16px; color: navy; }
        .state { margin: 3px 0; padding: 3px 8px; border-left: 5px solid gray; font-weight: bold; }
        .state.ok { border-color: seagreen; background: honeydew; }
        .state.risk { border-color: darkorange; background: floralwhite; }
        .state.fsp { border-color: gray; background: whitesmoke; }
        .steps { margin: 4px 0; padding-left: 18px; line-height: 1.4; }
        .big { font-size: 20px; font-weight: bold; color: navy; }
        .foot { margin-top: 3px; color: dimgray; font-size: 13px; line-height: 1.3; }
        [hidden] { display: none !important; }
        @media (max-width: 520px) {
            #chartWrap { height: 260px; }
            #controls { font-size: 14px; padding: 4px 8px; }
            .row label.t { min-width: 0; flex-basis: 100%; }
            .row input[type=range] { flex-basis: 100%; max-width: none; }
            select, button, input[type=number] { font-size: 14px; padding: 2px 5px; }
            #lower { padding: 4px 8px; }
        }
    </style>
    <script src="wood-moisture-shrinkage-calculator.js"></script>
</head>
<body>
    <main>
        <div id="chartWrap"><canvas id="woodChart" role="img" aria-label="Wood moisture content versus relative across-grain dimension"></canvas></div>
        <div id="controls">
            <div class="row">
                <label class="t" for="startSlider" id="startText">Starting MC (%): 19</label>
                <input type="range" id="startSlider" min="10" max="30" step="1" value="19" aria-label="Starting moisture content in percent">
            </div>
            <div class="row">
                <label class="t" for="finalSlider" id="finalText">Final MC (%): 9</label>
                <input type="range" id="finalSlider" min="4" max="19" step="1" value="9" aria-label="Final moisture content in percent">
            </div>
            <div class="row">
                <label for="depthSelect"><b>Member depth:</b></label>
                <select id="depthSelect"></select>
                <button id="winterBtn" type="button">Minnesota winter interior</button>
                <button id="weighBtn" type="button" aria-expanded="false">Weigh a sample</button>
            </div>
        </div>
        <div id="lower">
            <div id="readout" aria-live="polite"></div>
            <div id="sample" hidden>
                <h3>Weigh a sample</h3>
                <div class="row">
                    <label>Wet mass (g) <input type="number" id="wetMass" value="42" min="0" step="0.1"></label>
                    <label>Oven-dry mass (g) <input type="number" id="dryMass" value="35" min="0" step="0.1"></label>
                </div>
                <div id="sampleOut" aria-live="polite"></div>
            </div>
        </div>
    </main>
</body>
</html>
