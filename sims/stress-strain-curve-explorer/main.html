<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Stress-Strain Curve Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        main { width: 100%; border: 1px solid silver; background: white; }
        #chartWrap { position: relative; height: 420px; background: aliceblue; border-bottom: 1px solid silver; padding: 4px 6px 2px 6px; }
        #controls { padding: 6px 10px; font-size: 15px; border-bottom: 1px solid silver; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; margin: 2px 0; }
        .row label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
        .swatch { display: inline-block; width: 12px; height: 12px; border: 1px solid black; }
        #stressSlider { flex: 1 1 160px; min-width: 120px; max-width: 420px; }
        #stressText { min-width: 215px; }
        button { font-size: 15px; padding: 2px 10px; }
        #caption { padding: 4px 10px; font-size: 14px; line-height: 1.35; border-bottom: 1px solid silver; min-height: 38px; }
        #lower { display: flex; flex-wrap: wrap; gap: 8px 14px; padding: 6px 10px; }
        #readout { flex: 1 1 250px; }
        #tableWrap { flex: 2 1 340px; }
        h3 { margin: 0 0 4px 0; font-size: 16px; color: navy; }
        .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; }
        .stat { flex: 1 1 42%; min-width: 120px; }
        .stat span { display: block; font-size: 13px; color: dimgray; }
        .stat b { font-size: 16px; }
        .state { margin-top: 4px; padding: 3px 8px; border-left: 5px solid gray; font-weight: bold; }
        .state.elastic { border-color: seagreen; background: honeydew; }
        .state.plastic { border-color: darkorange; background: floralwhite; }
        .msg { margin-top: 3px; line-height: 1.3; }
        table { border-collapse: collapse; width: 100%; font-size: 13px; }
        th, td { border: 1px solid silver; padding: 2px 5px; text-align: left; }
        th { background: whitesmoke; }
        td.sel, th.sel { background: lightyellow; font-weight: bold; }
        .foot { margin-top: 3px; color: dimgray; font-size: 13px; }
        @media (max-width: 520px) {
            #chartWrap { height: 280px; }
            #controls { font-size: 14px; }
            #stressSlider { min-width: 80px; flex-basis: 80px; }
            button { font-size: 14px; padding: 2px 6px; }
            .row { gap: 4px 10px; }
            #stressText { min-width: 0; }
            table { font-size: 12px; }
            th, td { padding: 1px 3px; }
            #lower { padding: 4px 8px; }
        }
    </style>
    <script src="stress-strain-curve-explorer.js"></script>
</head>
<body>
    <main>
        <div id="chartWrap"><canvas id="ssChart" role="img" aria-label="Stress-strain curve chart"></canvas></div>
        <div id="controls">
            <div class="row" role="radiogroup" aria-label="Material">
                <b>Material:</b>
                <label><input type="radio" name="mat" value="steel" checked><span class="swatch" style="background:dimgray"></span>Steel</label>
                <label><input type="radio" name="mat" value="concrete"><span class="swatch" style="background:rgb(190,155,100)"></span>Concrete</label>
                <label><input type="radio" name="mat" value="wood"><span class="swatch" style="background:saddlebrown"></span>Wood</label>
                <label><input type="checkbox" id="areaToggle"> Show area under the curve</label>
                <label><input type="checkbox" id="compareToggle"> Compare all three</label>
                <label><input type="checkbox" id="zoomToggle"> Zoom in on small strains</label>
            </div>
            <div class="row">
                <label for="stressSlider" id="stressText">Applied stress: 0 psi</label>
                <input type="range" id="stressSlider" min="0" max="58000" step="100" value="0" aria-label="Applied stress in psi">
                <button id="releaseBtn" type="button">Release the load</button>
            </div>
        </div>
        <div id="caption" aria-live="polite"></div>
        <div id="lower">
            <div id="readout" aria-live="polite"></div>
            <div id="tableWrap"></div>
        </div>
    </main>
</body>
</html>
