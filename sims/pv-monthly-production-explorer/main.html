<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Rooftop PV Monthly Production Explorer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: black; background: white; }
        main { width: 100%; border: 1px solid silver; background: white; }
        h1 { margin: 0; padding: 5px 10px; font-size: 20px; text-align: center; background: aliceblue; border-bottom: 1px solid silver; }
        #panel { padding: 6px 10px; border-bottom: 1px solid silver; min-height: 218px; }
        .status { font-weight: bold; margin: 0 0 3px; white-space: pre-wrap; }
        .setting { color: dimgray; font-size: 15px; margin: 0 0 3px; }
        .question { margin: 0 0 5px; }
        .months { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px 6px; margin: 0 0 6px; }
        .months label { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin: 4px 0; }
        .row input[type=number] { width: 80px; font-size: 16px; }
        button { font-size: 16px; }
        .msg { margin: 6px 0 0; padding: 4px 8px; border-left: 5px solid silver; background: white; min-height: 58px; line-height: 1.3; }
        .msg.good { border-color: seagreen; background: honeydew; }
        .msg.bad { border-color: firebrick; background: mistyrose; }
        .ctl { display: flex; align-items: center; gap: 4px 10px; margin: 3px 0; }
        .ctl label.t { width: 215px; flex: 0 0 auto; white-space: nowrap; }
        .ctl input[type=range] { flex: 1 1 120px; min-width: 80px; }
        #chartBox { position: relative; height: 270px; padding: 4px 6px 0; background: aliceblue; border-bottom: 1px solid silver; }
        #chartHidden { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; color: dimgray; background: aliceblue; padding: 10px; }
        #readout { padding: 5px 10px; line-height: 1.3; min-height: 100px; }
        #readout b { color: navy; }
        .foot { color: dimgray; font-size: 14px; margin-top: 3px; }
        .hide { display: none !important; }
        @media (max-width: 520px) { .months { grid-template-columns: repeat(4, 1fr); } .ctl label.t { width: 150px; } }
    </style>
    <script src="pv-monthly-production-explorer.js"></script>
</head>
<body>
    <main>
        <h1>Rooftop PV Monthly Production Explorer</h1>
        <div id="panel">
            <div id="challengePane">
                <p class="status" id="status"></p>
                <p class="setting" id="setting"></p>
                <p class="question" id="question"></p>
                <div class="months" id="months" role="group" aria-label="Months with a surplus"></div>
                <div class="row" id="numRow">
                    <label for="kwInput"><b>Smallest whole-kW array:</b></label>
                    <input type="number" id="kwInput" min="1" max="30" step="1" aria-label="Array size in kilowatts"> kW
                </div>
                <div class="row">
                    <button id="checkBtn" type="button">Check</button>
                    <button id="nextBtn" type="button">Next challenge</button>
                </div>
                <div class="msg" id="msg" aria-live="polite"></div>
            </div>
            <div id="explorePane" class="hide">
                <div class="ctl"><label class="t" for="kwSlider" id="kwText">Array size: 7 kW</label>
                    <input type="range" id="kwSlider" min="3" max="12" step="1" value="7" aria-label="Array size in kilowatts"></div>
                <div class="ctl"><label class="t" for="drSlider" id="drText">Derate: 0.80</label>
                    <input type="range" id="drSlider" min="0.70" max="0.90" step="0.05" value="0.80" aria-label="Derate factor"></div>
                <div class="ctl"><label class="t" for="useSlider" id="useText">Annual use: 10,000 kWh</label>
                    <input type="range" id="useSlider" min="6000" max="16000" step="1000" value="10000" aria-label="Annual household use in kilowatt-hours"></div>
                <div class="ctl"><label class="t" for="profSel"><b>Load profile</b></label>
                    <select id="profSel" aria-label="Load profile"><option>Flat</option><option>Winter-heavy</option></select>
                    <button id="restartBtn" type="button">Restart challenges</button></div>
            </div>
        </div>
        <div id="chartBox">
            <canvas id="chart" role="img" aria-label="Grouped bars comparing monthly solar production with monthly household load for twelve months"></canvas>
            <div id="chartHidden">The chart stays hidden until you answer. Predict first, then check.</div>
        </div>
        <div id="readout" aria-live="polite"></div>
    </main>
</body>
</html>
