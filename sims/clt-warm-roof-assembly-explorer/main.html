<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>CLT warm roof MicroSim using P5.js 2.3.2</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <style>
        body {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }
        /* prediction panel above the drawing (the drawing and its p5 controls live inside <main>) */
        h1 { margin: 0; padding: 5px 10px; font-size: 26px; text-align: center; background: aliceblue; border: 1px solid silver; border-bottom: none; }
        #predict { padding: 6px 10px; border: 1px solid silver; border-bottom: none; background: aliceblue; font-size: 14px; line-height: 1.25; }
        #predict .head { font-weight: bold; margin: 0 0 4px; }
        #predict .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; margin: 4px 0; }
        #predict .opts label { display: flex; gap: 6px; align-items: flex-start; padding: 3px 6px; border: 1px solid silver; border-radius: 6px; background: white; cursor: pointer; }
        #predict .opts label.on { border-color: navy; background: lightyellow; }
        #predict .opts label.dim { color: gray; cursor: default; }
        #predict .row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin: 4px 0; }
        #predict button { font-size: 14px; padding: 2px 10px; }
        #predict .fb { margin: 4px 0 0; padding: 3px 8px; border-left: 5px solid silver; background: white; min-height: 56px; }
        #predict .fb.good { border-color: seagreen; background: honeydew; }
        #predict .fb.bad { border-color: firebrick; background: mistyrose; }
        #predict .score { margin-left: auto; font-weight: bold; }
        main { position: relative; }
        @media (max-width: 560px) { #predict .opts { grid-template-columns: 1fr; } }
    </style>
    <script src="clt-warm-roof-assembly-explorer.js"></script>
    <script src="layered-assembly-engine.js"></script>
    <script src="clt-predict.js"></script>
</head>
<body>
    <h1>CLT warm roof</h1>
    <div id="predict">
        <p class="head" id="pHead"></p>
        <div class="opts" id="pOpts" role="radiogroup" aria-label="Consequence if this layer is removed"></div>
        <div class="row">
            <button id="pGo" type="button">Commit and remove the layer</button>
            <span class="score" id="pScore"></span>
        </div>
        <div class="fb" id="pFb" aria-live="polite"></div>
    </div>
    <main></main>
    <br/>
    <a href=".">Back to CLT warm roof Lesson Plan</a>
</body>
</html>
