<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Service Headroom for Solar and EV Loads</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        main { width: 100%; border: 1px solid silver; background: white; }
        #charts { background: aliceblue; border-bottom: 1px solid silver; }
        #demandWrap { position: relative; height: 250px; padding: 4px 6px 0; }
        #solarWrap { position: relative; height: 130px; padding: 0 6px 4px; }
        #controls { padding: 6px 10px; font-size: 15px; border-bottom: 1px solid silver; }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px; margin: 3px 0; }
        .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; flex: 1 1 340px; }
        .ctl.slide { max-width: calc(50% - 10px); }
        @media (max-width: 760px) { .ctl.slide { max-width: none; } }
        .ctl label.t { min-width: 190px; white-space: nowrap; }
        .ctl input[type=range] { flex: 1 1 90px; min-width: 80px; }
        .ctl select { font-size: 15px; }
        .row label.opt { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        #readout { padding: 6px 10px; }
        .stats { display: flex; flex-wrap: wrap; gap: 2px 18px; }
        .stat span { display: block; font-size: 13px; color: dimgray; }
        .stat b { font-size: 17px; color: navy; }
        .state { margin: 4px 0; padding: 3px 8px; border-left: 5px solid gray; font-weight: bold; }
        .state.ok { border-color: seagreen; background: honeydew; }
        .state.bad { border-color: firebrick; background: mistyrose; }
        .state.lm { border-color: darkorange; background: floralwhite; }
        .opts { margin: 3px 0 0; padding: 0; list-style: none; line-height: 1.3; }
        .opts li { margin: 2px 0; }
        .foot { margin-top: 3px; color: dimgray; font-size: 13px; line-height: 1.3; }
        @media (max-width: 520px) {
            #demandWrap { height: 235px; }
            #solarWrap { height: 120px; }
            .foot { display: none; }
            #controls { font-size: 14px; padding: 4px 8px; }
            .ctl label.t { min-width: 0; }
            .row { gap: 2px 10px; margin: 1px 0; }
            #readout { padding: 4px 8px; }
            .opts { font-size: 13px; }
        }
    </style>
    <script src="service-headroom-ev-pv-explorer.js"></script>
</head>
<body>
    <main>
        <div id="charts">
            <div id="demandWrap"><canvas id="demandChart" role="img" aria-label="Stacked horizontal bar of the Riverbend demand load and electric vehicle chargers compared with the service capacity"></canvas></div>
            <div id="solarWrap"><canvas id="solarChart" role="img" aria-label="Bars comparing annual solar production with the building's illustrative annual energy use"></canvas></div>
        </div>
        <div id="controls">
            <div class="row">
                <div class="ctl"><label class="t" for="svcSelect"><b>Service size</b></label>
                    <select id="svcSelect" aria-label="Service size in amperes">
                        <option value="100">100 A</option><option value="200" selected>200 A</option><option value="400">400 A</option><option value="600">600 A</option>
                    </select>
                    <span style="white-space:nowrap" role="radiogroup" aria-label="Service voltage, three-phase"><label class="opt"><input type="radio" name="volt" value="208" checked> 208 V</label>
                    <label class="opt"><input type="radio" name="volt" value="480"> 480 V</label></span></div>
                <div class="ctl"><label class="opt"><input type="checkbox" id="lmBox"> <b>Use load management</b></label></div>
            </div>
            <div class="row">
                <div class="ctl slide"><label class="t" for="nSlider" id="nText">EV chargers: 4</label>
                    <input type="range" id="nSlider" min="0" max="12" step="1" value="4" aria-label="Number of EV chargers"></div>
                <div class="ctl slide"><label class="t" for="iSlider" id="iText">Charger current: 32 A</label>
                    <input type="range" id="iSlider" min="16" max="80" step="1" value="32" aria-label="Charger current in amperes"></div>
            </div>
            <div class="row">
                <div class="ctl slide"><label class="t" for="pvSlider" id="pvText">PV array size: 30 kW</label>
                    <input type="range" id="pvSlider" min="0" max="100" step="5" value="30" aria-label="Photovoltaic array size in kilowatts"></div>
            </div>
        </div>
        <div id="readout" aria-live="polite"></div>
    </main>
</body>
</html>
