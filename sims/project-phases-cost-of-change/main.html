<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Project Phases and the Cost of Change</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: black;
            background: white;
        }
        #app {
            width: 100%;
            height: 100vh;
            border: 1px solid silver;
            display: flex;
            flex-direction: column;
            background: white;
        }
        #chartWrap {
            position: relative;
            flex: 0 0 330px;
            background: aliceblue;
            border-bottom: 1px solid silver;
            padding: 4px 6px 2px 6px;
        }
        #controls {
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 18px;
            padding: 6px 10px;
            font-size: 15px;
            border-bottom: 1px solid silver;
        }
        #controls label { display: flex; align-items: center; gap: 6px; }
        #controls input[type=range] { width: 170px; max-width: 40vw; }
        #wallLabel { white-space: nowrap; }
        #infobox {
            flex: 1 1 auto;
            padding: 6px 12px 6px 12px;
            font-size: 14px;
            line-height: 1.35;
            overflow: auto;
        }
        #infobox h3 { margin: 0 0 3px 0; font-size: 16px; color: navy; }
        #infobox .row { margin: 1px 0; }
        #infobox .wall { margin-top: 4px; padding: 4px 8px; border-left: 4px solid darkorange; background: floralwhite; }
        #infobox .early { margin-top: 4px; padding: 4px 8px; border-left: 4px solid seagreen; background: honeydew; }
        #infobox .note { margin-top: 3px; color: dimgray; font-size: 13px; }
        @media (max-width: 520px) {
            #chartWrap { flex-basis: 285px; }
            #infobox { font-size: 13px; line-height: 1.3; padding: 4px 8px; }
            #infobox h3 { font-size: 15px; }
            #infobox .note { display: none; }
        }
    </style>
    <script src="project-phases-cost-of-change.js"></script>
</head>
<body>
    <div id="app">
        <div id="chartWrap"><canvas id="phaseChart" aria-label="Line chart of ability to influence the design falling and cost of a change rising across eight project phases" role="img"></canvas></div>
        <div id="controls">
            <label><input type="checkbox" id="earlyToggle"> Early collaboration</label>
            <label><span>Move the wall:</span>
                <input type="range" id="wallSlider" min="1" max="8" step="1" value="2" aria-label="Move the wall to project phase">
            </label>
            <span id="wallLabel"></span>
        </div>
        <div id="infobox" aria-live="polite"></div>
    </div>
</body>
</html>
