<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Sensor-to-Action Map</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 16px; color: black; background: white; }
        main { width: 100%; border: 1px solid silver; background: white; }
        h1 { margin: 0; padding: 5px 10px; font-size: 20px; text-align: center; background: aliceblue; border-bottom: 1px solid silver; }
        #prompt { padding: 6px 10px; background: aliceblue; border-bottom: 1px solid silver; min-height: 62px; line-height: 1.3; }
        #prompt b { color: navy; }
        #network { width: 100%; height: 350px; background: aliceblue; border-bottom: 1px solid silver; }
        #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 6px 10px; border-bottom: 1px solid silver; }
        #controls select { font-size: 16px; max-width: 280px; }
        button { font-size: 16px; padding: 3px 10px; }
        #score { margin-left: auto; font-weight: bold; }
        #fb { padding: 6px 10px; min-height: 100px; line-height: 1.3; border-left: 5px solid silver; margin: 6px 10px; }
        #fb.good { border-color: seagreen; background: honeydew; }
        #fb.bad { border-color: firebrick; background: mistyrose; }
        #fb.info { border-color: navy; background: aliceblue; }
        .foot { padding: 0 10px 6px; color: dimgray; font-size: 14px; }
        .hide { display: none !important; }
    </style>
    <script src="sensor-to-action-map.js"></script>
</head>
<body>
    <main>
        <h1>Sensor-to-Action Map</h1>
        <div id="prompt"></div>
        <div id="network" role="img" aria-label="Six building inputs on the left and six control actions on the right, linked as the learner matches them"></div>
        <div id="controls">
            <label for="actionSel"><b>Action:</b></label>
            <select id="actionSel" aria-label="Choose the action this input should drive"></select>
            <button id="goBtn" type="button">Confirm choice</button>
            <span id="score"></span>
        </div>
        <div id="fb" class="info" aria-live="polite"></div>
        <div class="foot">* The utility price signal comes from the utility. It is a signal, not a sensor. Click an action to choose it, then confirm.</div>
    </main>
</body>
</html>
