<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Building Material Property Comparison Chart</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; font-size: 14px; color: black; background: white; }
        main { width: 100%; border: 1px solid silver; background: white; }
        #chartWrap { position: relative; height: 390px; background: aliceblue; border-bottom: 1px solid silver; padding: 4px 6px 2px 6px; }
        #controls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 6px 10px; font-size: 15px; border-bottom: 1px solid silver; }
        #controls label { display: flex; align-items: center; gap: 6px; }
        #controls select { font-size: 15px; max-width: 100%; }
        #controls label.off { color: gray; }
        #infobox { padding: 6px 12px; font-size: 14px; line-height: 1.35; }
        #infobox h3 { margin: 0 0 3px 0; font-size: 16px; color: navy; }
        #infobox .row { margin: 2px 0; }
        #infobox .note { margin-top: 4px; padding: 4px 8px; border-left: 4px solid goldenrod; background: floralwhite; }
        #infobox .foot { margin-top: 4px; color: dimgray; font-size: 13px; }
        @media (max-width: 520px) {
            #chartWrap { height: 360px; }
            #infobox { font-size: 13px; padding: 4px 8px; }
            #infobox h3 { font-size: 15px; }
        }
    </style>
    <script src="building-material-property-comparison-chart.js"></script>
</head>
<body>
    <main>
        <div id="chartWrap"><canvas id="matChart" role="img" aria-label="Horizontal bar chart comparing one property across seven building materials"></canvas></div>
        <div id="controls">
            <label>Property:
                <select id="propSelect" aria-label="Property to compare"></select>
            </label>
            <label><input type="checkbox" id="logToggle" checked> Logarithmic scale</label>
            <label id="divLabel"><input type="checkbox" id="divToggle"> Divide by density</label>
        </div>
        <div id="infobox" aria-live="polite"></div>
    </main>
</body>
</html>
